[project]
name = "agentzero"
version = "0.2.0"
description = "Agent Zero — an agentic coding IDE for small open-weight models"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentzero = "agentzero.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentzero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default, like `npm test` was.
addopts = "-q"
